name: Release to npm

# Stages the package on npm when a GitHub release is published; a maintainer then approves it with 2FA.
# The release tag must match package.json, e.g. tag v2.0.0 for version 2.0.0.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci

      - run: npm test

      - run: npm run build

      # Staged publishing needs npm 11.15+, newer than the npm bundled with Node 24
      - name: Update npm
        run: npm install -g npm@11 && npm --version

      # Uploads the version to npm's staging queue. It goes live only after a maintainer
      # approves it with 2FA on npmjs.com (Staged Packages tab) or via `npm stage approve <stage-id>`.
      - name: Stage for publishing
        run: |
          # Pre-releases (e.g. 2.1.0-beta.1) go to the "next" dist-tag instead of "latest".
          # The dist-tag is fixed when staging and cannot be changed on approval.
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            TAG=next
          else
            TAG=latest
          fi
          npm stage publish --provenance --access public --tag "$TAG"
          {
            echo "### restate-nest@${GITHUB_REF_NAME#v} staged with tag \`$TAG\`"
            echo
            echo "Approve it on https://www.npmjs.com/package/restate-nest (Staged Packages tab),"
            echo "or run \`npm stage list restate-nest\` and \`npm stage approve <stage-id>\`."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          # Only needed without npm trusted publishing; leave the secret unset to use OIDC
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
